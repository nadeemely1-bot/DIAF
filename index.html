<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Crew Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-dashboard">
        <h2 id="title">Click Play to Initialize Stream...</h2>
        
        <!-- FIX 1: Added preload="auto" to tell the browser to aggressively download the track chunks in the background -->
        <audio id="audio-engine" src="" preload="auto" crossorigin="anonymous"></audio>

        <div class="controls-row">
            <button id="prev">⏮ Back</button>
            <button id="play">▶ Play</button>
            <button id="next">⏭ Next</button>
        </div>

        <div class="slider-wrapper">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-duration">0:00</span>
        </div>

        <div class="volume-wrapper">
            <button id="mute-btn">🔊 Mute</button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        
        <ul id="list"></ul>
    </div>

    <script>
        const tracks = [
            { name: "1. Crimmels - Stealing All The Air [Official Audio]", url: "https://catbox.moe" },
            { name: "2. DIAF", url: "https://catbox.moe" },
            { name: "3. M.I.A. - [Official Diss Track]", url: "https://catbox.moe" },
            { name: "4. M.I.A. 2 (Official Diss Track)", url: "https://catbox.moe" },
            { name: "5. New Diss Lil Rupee", url: "https://catbox.moe" },
            { name: "6. Scammer Boy - Disstrack", url: "https://catbox.moe" },
            { name: "7. Special Mentioned (Audio Track 1)", url: "https://catbox.moe" },
            { name: "8. Youngnelly - All Around Diss [Audio]", url: "https://catbox.moe" },
            { name: "9. Youngnelly ft. BBD (Official Diss)", url: "https://catbox.moe" }
        ];

        let currentTrackIndex = 0;
        let isMuted = false;
        let previousVolume = 1;
        let isInitialized = false; // Tracks if user has clicked to bypass security block

        const audioEngine = document.getElementById('audio-engine');
        const playBtn = document.getElementById('play');
        const songTitle = document.getElementById('title');
        const playlistUI = document.getElementById('list');
        
        const progressBar = document.getElementById('progress-bar');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalDurationDisplay = document.getElementById('total-duration');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        function loadSong(index) {
            currentTrackIndex = index;
            audioEngine.src = tracks[index].url;
            
            // FIX 2: Explicitly tell the browser engine to fetch the new stream source instantly
            audioEngine.load(); 
            
            songTitle.textContent = tracks[index].name;
            
            progressBar.value = 0;
            currentTimeDisplay.textContent = "0:00";
            totalDurationDisplay.textContent = "0:00";

            playlistUI.innerHTML = "";
            tracks.forEach((track, i) => {
                const item = document.createElement('li');
                item.textContent = track.name;
                
                if (i === currentTrackIndex) {
                    item.classList.add('active-song');
                }
                
                item.onclick = () => { 
                    isInitialized = true;
                    loadSong(i); 
                    startPlayback();
                };
                playlistUI.appendChild(item);
            });
        }

        function startPlayback() {
            // FIX 3: Clean handling of the security check promise block
            audioEngine.play()
                .then(() => {
                    playBtn.textContent = "⏸ Pause";
                })
                .catch(error => {
                    console.log("Playback held by browser safety security checks.", error);
                    playBtn.textContent = "▶ Play";
                });
        }

        function pausePlayback() {
            audioEngine.pause();
            playBtn.textContent = "▶ Play";
        }

        playBtn.onclick = () => {
            // Clicking the play button instantly clears the browser security block
            isInitialized = true; 
            if (audioEngine.paused) {
                startPlayback();
            } else {
                pausePlayback();
            }
        };

        audioEngine.ontimeupdate = () => {
            if (!isNaN(audioEngine.duration)) {
                const progressPercentage = (audioEngine.currentTime / audioEngine.duration) * 100;
                progressBar.value = progressPercentage;
                currentTimeDisplay.textContent = formatTime(audioEngine.currentTime);
                totalDurationDisplay.textContent = formatTime(audioEngine.duration);
            }
        };

        progressBar.oninput = () => {
            if (!isNaN(audioEngine.duration)) {
                const targetTime = (progressBar.value / 100) * audioEngine.duration;
                audioEngine.currentTime = targetTime;
            }
        };

        volumeSlider.oninput = () => {
            audioEngine.volume = volumeSlider.value;
            if (audioEngine.volume === 0) {
                muteBtn.textContent = "🔈 Muted";
                isMuted = true;
            } else {
                muteBtn.textContent = "🔊 Mute";
                isMuted = false;
            }
        };

        muteBtn.onclick = () => {
            if (!isMuted) {
                previousVolume = audioEngine.volume;
                audioEngine.volume = 0;
                volumeSlider.value = 0;
                muteBtn.textContent = "🔈 Muted";
                isMuted = true;
            } else {
                audioEngine.volume = previousVolume;
                volumeSlider.value = previousVolume;
                muteBtn.textContent = "🔊 Mute";
                isMuted = false;
            }
        };

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        document.getElementById('next').onclick = () => {
            currentTrackIndex++;
            if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;
            loadSong(currentTrackIndex); 
            startPlayback();
        };

        document.getElementById('prev').onclick = () => {
            currentTrackIndex--;
            if (currentTrackIndex < 0) currentTrackIndex = tracks.length - 1;
            loadSong(currentTrackIndex); 
            startPlayback();
        };

        audioEngine.onended = () => { 
            document.getElementById('next').click(); 
        };
        
        // Prepare the first track in the cache buffer line
        loadSong(currentTrackIndex);
    </script>
</body>
</html>
