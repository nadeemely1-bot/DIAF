<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Crew Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">
        <h2 id="title">Loading music...</h2>
        <audio id="audio-engine" src=""></audio>

        <div class="buttons">
            <button id="prev">⏮ Back</button>
            <button id="play">▶ Play</button>
            <button id="next">⏭ Next</button>
        </div>
        
        <!-- The visual playlist container -->
        <ul id="list"></ul>
    </div>

    <script>
        // All 9 tracks are fully mapped to their working Catbox streams below
        const tracks = [
            { name: "1. Crimmels - Stealing All The Air [Official Audio]", url: "https://files.catbox.moe/c5gatk.mp3" },
            { name: "2. DIAF", url: "https://files.catbox.moe/mtj0mm.mp3" },
            { name: "3. M.I.A. - [Official Diss Track]", url: "https://files.catbox.moe/rh8nah.mp3" },
            { name: "4. M.I.A. 2 (Official Diss Track)", url: "https://files.catbox.moe/3saccp.mp3" },
            { name: "5. New Diss Lil Rupee", url: "https://files.catbox.moe/e5pgl6.mp3" },
            { name: "6. Scammer Boy - Disstrack", url: "https://files.catbox.moe/qf7d15.mp3" },
            { name: "7. Special Mentioned (Audio Track 1)", url: "https://files.catbox.moe/sdklsp.mp3" },
            { name: "8. Youngnelly - All Around Diss [Audio]", url: "https://files.catbox.moe/flpkej.mp3" },
            { name: "9. Youngnelly ft. BBD (Official Diss)", url: "https://files.catbox.moe/gtzqnt.mp3" }
        ];

        let currentTrackIndex = 0;
        const audioEngine = document.getElementById('audio-engine');
        const playBtn = document.getElementById('play');
        const songTitle = document.getElementById('title');
        const playlistUI = document.getElementById('list');

        function loadSong(index) {
            currentTrackIndex = index;
            audioEngine.src = tracks[index].url;
            songTitle.textContent = tracks[index].name;
            
            // Build the song title dashboard display
            playlistUI.innerHTML = "";
            tracks.forEach((track, i) => {
                const item = document.createElement('li');
                item.textContent = track.name;
                
                // Active highlight formatting
                if (i === currentTrackIndex) {
                    item.style.color = "#1db954";
                    item.style.fontWeight = "bold";
                }
                
                item.onclick = () => { 
                    loadSong(i); 
                    startPlayback();
                };
                playlistUI.appendChild(item);
            });
        }

        function startPlayback() {
            audioEngine.play()
                .then(() => {
                    playBtn.textContent = "⏸ Pause";
                })
                .catch(error => {
                    console.log("Stream error handled.", error);
                    playBtn.textContent = "▶ Play";
                });
        }

        function pausePlayback() {
            audioEngine.pause();
            playBtn.textContent = "▶ Play";
        }

        playBtn.onclick = () => {
            if (audioEngine.paused) {
                startPlayback();
            } else {
                pausePlayback();
            }
        };

        document.getElementById('next').onclick = () => {
            currentTrackIndex++;
            if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;
            loadSong(currentTrackIndex); 
            startPlayback();
        };

        document.getElementById('prev').onclick = () => {
            currentTrackIndex--;
            if (currentTrackIndex < 0) currentTrackIndex = tracks.length - 1;
            loadSong(currentTrackIndex); 
            startPlayback();
        };

        audioEngine.onended = () => { 
            document.getElementById('next').click(); 
        };
        
        loadSong(currentTrackIndex);
    </script>
</body>
</html>
